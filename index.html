<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    
    <title>HPAY | NEXT GEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');

        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Outfit', sans-serif;
            height: 100dvh;
            overflow: hidden;
        }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }

        .neon-border-orange { border-bottom: 2px solid #f97316; box-shadow: 0 4px 20px -5px rgba(249, 115, 22, 0.5); }
        
        .safe-area-top { padding-top: env(safe-area-inset-top); }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }

        ::-webkit-scrollbar { display: none; }

        .btn-press:active { transform: scale(0.95); transition: 0.1s; }
        
        input::placeholder { color: #555; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const categories = [
            { id: 'food', label: 'Comida', icon: '🍔' },
            { id: 'work', label: 'Trampo', icon: '💰' },
            { id: 'fun', label: 'Lazer', icon: '🎮' },
            { id: 'other', label: 'Outros', icon: '📦' }
        ];

        function App() {
            const [transactions, setTransactions] = useState([]);
            const [desc, setDesc] = useState('');
            const [val, setVal] = useState('');
            const [cat, setCat] = useState('other');
            const [filter, setFilter] = useState('all');

            useEffect(() => {
                const saved = localStorage.getItem('hpay_v3');
                if (saved) setTransactions(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('hpay_v3', JSON.stringify(transactions));
            }, [transactions]);

            const addTransaction = (type) => {
                if (!desc || !val) return;
                const newItem = {
                    id: Date.now(),
                    desc,
                    val: parseFloat(val),
                    type,
                    cat,
                    date: new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })
                };
                setTransactions([newItem, ...transactions]);
                setDesc(''); setVal('');
            };

            const totalIn = transactions.filter(t => t.type === 'in').reduce((acc, t) => acc + t.val, 0);
            const totalOut = transactions.filter(t => t.type === 'out').reduce((acc, t) => acc + t.val, 0);
            const balance = totalIn - totalOut;
            const percentUsed = totalIn > 0 ? Math.min((totalOut / totalIn) * 100, 100) : 0;

            const filteredList = transactions.filter(t => {
                if (filter === 'all') return true;
                return t.type === filter;
            });

            return (
                <div className="h-[100dvh] flex flex-col bg-black safe-area-top">
                    
                    {/* Header */}
                    <header className="px-6 py-6 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center font-black text-black">H</div>
                            <h1 className="text-xl font-bold tracking-tight">HPAY <span className="text-orange-500 font-light text-sm">v3.0</span></h1>
                        </div>
                        <button onClick={() => {if(confirm('Limpar tudo?')) setTransactions([])}} className="w-10 h-10 rounded-full glass flex items-center justify-center text-xs">🗑️</button>
                    </header>

                    <main className="flex-1 overflow-y-auto px-6 pb-40">
                        
                        {/* Card de Saldo Moderno */}
                        <div className="glass p-8 rounded-[2.5rem] mb-6 relative overflow-hidden">
                            <div className="absolute top-[-20px] right-[-20px] w-40 h-40 bg-orange-500/10 blur-[60px] rounded-full"></div>
                            <p className="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-1">Saldo Atual</p>
                            <h2 className="text-4xl font-black mb-6 italic">R$ {balance.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</h2>
                            
                            {/* Barra de Progresso Gastos vs Entradas */}
                            <div className="space-y-2">
                                <div className="flex justify-between text-[10px] font-bold text-zinc-400 uppercase">
                                    <span>Consumo de Receita</span>
                                    <span>{percentUsed.toFixed(0)}%</span>
                                </div>
                                <div className="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                                    <div 
                                        className="h-full bg-orange-500 transition-all duration-1000" 
                                        style={{width: `${percentUsed}%`}}
                                    ></div>
                                </div>
                            </div>
                        </div>

                        {/* Inputs */}
                        <div className="space-y-3 mb-8">
                            <input 
                                type="text" 
                                placeholder="O que você comprou?" 
                                value={desc}
                                onChange={e => setDesc(e.target.value)}
                                className="w-full bg-zinc-900/50 border border-white/5 p-5 rounded-2xl text-sm"
                            />
                            
                            <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                                {categories.map(c => (
                                    <button 
                                        key={c.id}
                                        onClick={() => setCat(c.id)}
                                        className={`px-4 py-2 rounded-xl text-xs whitespace-nowrap transition-all ${cat === c.id ? 'bg-orange-500 text-black font-bold' : 'glass text-zinc-400'}`}
                                    >
                                        {c.icon} {c.label}
                                    </button>
                                ))}
                            </div>

                            <div className="flex gap-3">
                                <input 
                                    type="number" 
                                    placeholder="0,00" 
                                    value={val}
                                    onChange={e => setVal(e.target.value)}
                                    className="flex-1 bg-zinc-900/50 border border-white/5 p-5 rounded-2xl font-bold text-xl"
                                />
                                <button onClick={() => addTransaction('in')} className="btn-press w-14 h-14 bg-white rounded-2xl flex items-center justify-center text-black text-2xl font-bold">↑</button>
                                <button onClick={() => addTransaction('out')} className="btn-press w-14 h-14 bg-orange-500 rounded-2xl flex items-center justify-center text-black text-2xl font-bold">↓</button>
                            </div>
                        </div>

                        {/* Filtros e Lista */}
                        <div className="space-y-4">
                            <div className="flex gap-4 border-b border-white/5 pb-2">
                                <button onClick={() => setFilter('all')} className={`text-[10px] font-bold uppercase ${filter === 'all' ? 'text-orange-500' : 'text-zinc-600'}`}>Tudo</button>
                                <button onClick={() => setFilter('in')} className={`text-[10px] font-bold uppercase ${filter === 'in' ? 'text-orange-500' : 'text-zinc-600'}`}>Entradas</button>
                                <button onClick={() => setFilter('out')} className={`text-[10px] font-bold uppercase ${filter === 'out' ? 'text-orange-500' : 'text-zinc-600'}`}>Saídas</button>
                            </div>

                            <div className="space-y-3">
                                {filteredList.map(t => (
                                    <div key={t.id} className="glass p-4 rounded-3xl flex items-center justify-between">
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-2xl bg-black flex items-center justify-center text-xl">
                                                {categories.find(c => c.id === t.cat)?.icon || '📦'}
                                            </div>
                                            <div>
                                                <p className="font-bold text-sm leading-tight">{t.desc}</p>
                                                <p className="text-[10px] text-zinc-600 font-bold uppercase">{t.date}</p>
                                            </div>
                                        </div>
                                        <p className={`font-black ${t.type === 'in' ? 'text-green-500' : 'text-white'}`}>
                                            {t.type === 'in' ? '+' : '-'} R$ {t.val.toFixed(2)}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* Navbar */}
                    <div className="fixed bottom-0 w-full px-6 pb-10 pt-4 bg-gradient-to-t from-black via-black to-transparent">
                        <div className="glass h-16 rounded-full flex items-center justify-around px-2">
                            <div className="w-12 h-12 bg-orange-500/10 rounded-full flex items-center justify-center text-orange-500">🏠</div>
                            <div className="text-zinc-700">📊</div>
                            <div className="text-zinc-700">⚙️</div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(() => console.log("SW ON"));
      }
    </script>
</body>
</html>
