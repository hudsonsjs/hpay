<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    
    <title>HPAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { background-color: #000; color: #fff; font-family: ui-sans-serif, system-ui; overflow: hidden; }
        .glass { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .safe-top { padding-top: env(safe-area-inset-top); }
        input { -webkit-appearance: none; border-radius: 1rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [transactions, setTransactions] = useState([]);
            const [desc, setDesc] = useState('');
            const [val, setVal] = useState('');

            useEffect(() => {
                const saved = localStorage.getItem('hpay_data');
                if (saved) setTransactions(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('hpay_data', JSON.stringify(transactions));
            }, [transactions]);

            const addTransaction = (type) => {
                if (!desc || !val) return;
                const newItem = {
                    id: Date.now(),
                    desc,
                    val: parseFloat(val),
                    type,
                    date: new Date().toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'})
                };
                setTransactions([newItem, ...transactions]);
                setDesc(''); setVal('');
            };

            const balance = transactions.reduce((acc, t) => t.type === 'in' ? acc + t.val : acc - t.val, 0);

            return (
                <div className="h-[100dvh] flex flex-col safe-top safe-bottom">
                    
                    <header className="px-6 py-8 flex justify-between items-center">
                        <div>
                            <h1 className="text-3xl font-black tracking-tighter">H<span className="text-orange-500">PAY</span></h1>
                            <p className="text-[10px] font-bold text-zinc-500 tracking-widest uppercase text-left">My Control</p>
                        </div>
                        <div className="w-10 h-10 rounded-2xl bg-zinc-900 border border-white/10 flex items-center justify-center text-orange-500 font-black">
                            H
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto px-6 pb-24 space-y-6">
                        <div className="glass p-8 rounded-[2.5rem] relative overflow-hidden">
                            <p className="text-xs font-bold text-zinc-500 uppercase mb-1">Saldo</p>
                            <h2 className={`text-4xl font-black tracking-tighter ${balance < 0 ? 'text-red-500' : 'text-white'}`}>
                                R$ {balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                            </h2>
                        </div>

                        <div className="glass p-5 rounded-[2rem] space-y-3">
                            <input 
                                type="text" placeholder="O que foi?" value={desc} onChange={e => setDesc(e.target.value)}
                                className="w-full bg-white/5 border border-white/5 p-4 rounded-2xl outline-none focus:border-orange-500/40 text-sm"
                            />
                            <div className="flex gap-2">
                                <input 
                                    type="number" placeholder="Valor" value={val} onChange={e => setVal(e.target.value)}
                                    className="flex-1 bg-white/5 border border-white/5 p-4 rounded-2xl outline-none focus:border-orange-500/40 font-bold text-xl"
                                />
                                <button onClick={() => addTransaction('in')} className="w-14 h-14 bg-orange-500 rounded-2xl flex items-center justify-center text-black text-2xl font-bold active:scale-90 transition-all">+</button>
                                <button onClick={() => addTransaction('out')} className="w-14 h-14 bg-white rounded-2xl flex items-center justify-center text-black text-2xl font-bold active:scale-90 transition-all">-</button>
                            </div>
                        </div>

                        <div className="space-y-3">
                            <h3 className="text-[10px] font-black text-zinc-600 uppercase tracking-widest px-2">Histórico</h3>
                            {transactions.map(t => (
                                <div key={t.id} className="glass p-4 rounded-2xl flex justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-1.5 h-1.5 rounded-full ${t.type === 'in' ? 'bg-orange-500' : 'bg-zinc-700'}`}></div>
                                        <div>
                                            <p className="text-sm font-bold">{t.desc}</p>
                                            <p className="text-[9px] text-zinc-500 font-bold uppercase">{t.date}</p>
                                        </div>
                                    </div>
                                    <p className={`font-black text-sm ${t.type === 'in' ? 'text-orange-500' : 'text-zinc-200'}`}>
                                        R$ {t.val.toFixed(2)}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </main>

                    <nav className="fixed bottom-6 inset-x-6">
                        <div className="glass h-16 rounded-full flex items-center justify-around px-2 shadow-2xl">
                            <button className="flex-1 flex justify-center text-orange-500">🏠</button>
                            <button onClick={() => {if(confirm('Zerar tudo?')) setTransactions([])}} className="flex-1 flex justify-center text-zinc-600">🗑️</button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
