<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HPAY">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    
    <title>HPAY | OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            overflow: hidden; 
            height: 100dvh;
        }

        /* Efeito de Vidro */
        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* Brilho Neon no Saldo */
        .neon-glow {
            text-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
        }

        /* Ajustes para telas com Notch */
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

        /* Remover estilo padrão de input no iOS */
        input { -webkit-appearance: none; outline: none; }
        
        /* Animação de entrada da lista */
        .item-anim { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [transactions, setTransactions] = useState([]);
            const [desc, setDesc] = useState('');
            const [val, setVal] = useState('');

            useEffect(() => {
                const saved = localStorage.getItem('hpay_v2');
                if (saved) setTransactions(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('hpay_v2', JSON.stringify(transactions));
            }, [transactions]);

            const addTransaction = (type) => {
                if (!desc || !val) return;
                const newItem = {
                    id: Date.now(),
                    desc,
                    val: parseFloat(val),
                    type,
                    date: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
                };
                setTransactions([newItem, ...transactions]);
                setDesc(''); setVal('');
            };

            const balance = transactions.reduce((acc, t) => t.type === 'in' ? acc + t.val : acc - t.val, 0);

            return (
                <div className="h-[100dvh] flex flex-col safe-top safe-bottom bg-black">
                    
                    {/* Header Minimalista */}
                    <header className="px-8 py-10 flex justify-between items-end">
                        <div>
                            <p className="text-orange-500 text-[10px] font-black uppercase tracking-[0.4em] mb-1">Status: Online</p>
                            <h1 className="text-4xl font-black tracking-tighter italic">H<span className="text-zinc-500">PAY</span></h1>
                        </div>
                        <div className="text-right">
                            <p className="text-zinc-600 text-[10px] font-bold uppercase">System v2.0</p>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto px-6 space-y-8 pb-32">
                        
                        {/* Card Principal de Saldo */}
                        <div className="glass p-10 rounded-[3rem] border-t-orange-500/20 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-orange-500/5 blur-[50px] rounded-full"></div>
                            <p className="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-2">Available Balance</p>
                            <h2 className={`text-5xl font-black tracking-tighter neon-glow ${balance < 0 ? 'text-red-500' : 'text-white'}`}>
                                <span className="text-2xl mr-1 text-zinc-600 font-normal">R$</span>
                                {balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                            </h2>
                        </div>

                        {/* Painel de Entrada */}
                        <div className="grid gap-4">
                            <input 
                                type="text" 
                                placeholder="Descrição do gasto..." 
                                value={desc} 
                                onChange={e => setDesc(e.target.value)}
                                className="w-full bg-zinc-900/50 border border-white/5 p-5 rounded-3xl text-sm focus:border-orange-500/50 transition-all shadow-inner"
                            />
                            <div className="flex gap-3">
                                <input 
                                    type="number" 
                                    placeholder="0,00" 
                                    value={val} 
                                    onChange={e => setVal(e.target.value)}
                                    className="flex-1 bg-zinc-900/50 border border-white/5 p-5 rounded-3xl font-black text-2xl focus:border-orange-500/50 transition-all"
                                />
                                <button onClick={() => addTransaction('in')} className="w-16 h-16 bg-orange-500 rounded-3xl flex items-center justify-center text-black text-3xl font-black active:scale-90 transition-all shadow-lg shadow-orange-500/20">+</button>
                                <button onClick={() => addTransaction('out')} className="w-16 h-16 bg-white rounded-3xl flex items-center justify-center text-black text-3xl font-black active:scale-90 transition-all shadow-lg shadow-white/10">-</button>
                            </div>
                        </div>

                        {/* Timeline de Atividade */}
                        <div className="space-y-4">
                            <div className="flex justify-between items-center px-2">
                                <h3 className="text-[10px] font-black text-zinc-600 uppercase tracking-[0.2em]">Activity Log</h3>
                                <button onClick={() => setTransactions([])} className="text-[10px] text-zinc-700 font-bold uppercase hover:text-red-500">Clear</button>
                            </div>
                            
                            <div className="space-y-3">
                                {transactions.map(t => (
                                    <div key={t.id} className="glass p-5 rounded-[2rem] flex justify-between items-center item-anim">
                                        <div className="flex items-center gap-4">
                                            <div className={`w-3 h-3 rounded-full ${t.type === 'in' ? 'bg-orange-500 shadow-[0_0_10px_rgba(249,115,22,0.5)]' : 'bg-zinc-800'}`}></div>
                                            <div>
                                                <p className="text-sm font-bold tracking-tight">{t.desc}</p>
                                                <p className="text-[9px] text-zinc-600 font-black uppercase">{t.date}</p>
                                            </div>
                                        </div>
                                        <p className={`font-black text-base ${t.type === 'in' ? 'text-orange-500' : 'text-zinc-400'}`}>
                                            {t.type === 'in' ? '+' : '-'} {t.val.toFixed(2)}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* Dock Inferior */}
                    <div className="fixed bottom-0 w-full p-8 bg-gradient-to-t from-black via-black/90 to-transparent">
                        <nav className="glass h-20 rounded-[2.5rem] flex items-center justify-around px-4">
                            <button className="p-4 text-orange-500 transition-transform active:scale-75">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            </button>
                            <button className="p-4 text-zinc-700 transition-transform active:scale-75">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20v-6M6 20V10M18 20V4"/></svg>
                            </button>
                            <button className="p-4 text-zinc-700 transition-transform active:scale-75">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                            </button>
                        </nav>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log("Vigia (Service Worker) Ativo!"))
      .catch((err) => console.log("Erro no vigia:", err));
  }
</script>
</body>
</html>
